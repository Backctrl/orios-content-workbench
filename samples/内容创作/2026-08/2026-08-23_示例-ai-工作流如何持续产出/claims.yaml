  # ── 生成式AI ──
  - id: claim-002
    text: 大模型本地部署验收至少覆盖许可适用性、硬件和磁盘门槛、软件版本、模型文件大小或哈希、运行时节点加载、GPU 实际占用、一次代表性生成，以及输出文件的时长、分辨率与编码，且每项结果应记录为可复核证据
    source: 40_知识库/生成式AI/大模型本地部署验收流程.md
    status: verified

  # ── 系统运维 ──
  - id: claim-003
    text: 大文件下载工具应启用重试和续传并使用固定可识别的目标路径；完成后校验实际长度与官方元数据；官方文件更新时先核对版本与提交记录；只有确认单个文件损坏时才删除该明确文件后重下
    source: 40_知识库/系统运维/大文件断点续传与完整性校验.md
    status: verified

  # ── 系统架构 ──
  - id: claim-004
    text: CCD感知线程编排层位于业务算法与通用线程调度之间，将任务绑定到适合的 CCD、利用局部 L3 缓存复用，并通过受控的跨域迁移处理负载不均衡，适用于访问局部性强、数据工作集大且跨缓存域代价高的服务
    source: 40_知识库/系统架构/CCD感知线程编排.md
    status: verified
  - id: claim-005
    text: Write-back 分层存储的写路径先将完整数据放入缓存、索引进入回写队列由批处理写入数据库和对象存储；读路径优先缓存，未命中时合并并发回源请求；系统必须设计缓存或持久层故障时的暂停、补偿、限流和直读直写降级
    source: 40_知识库/系统架构/Write-back分层存储.md
    status: verified
  - id: claim-006
    text: 冷热感知映射器按负载排序对象，将热对象优先放入当前累计压力最低的资源域并与冷对象搭配；快窗口感知突发变化、慢窗口提供稳定基线；映射更新通过版本隔离让旧任务完成、新任务切换，避免抖动
    source: 40_知识库/系统架构/冷热感知映射.md
    status: verified
  - id: claim-007
    text: 异步 DAG 任务编排用节点表达任务、边表达依赖，支持并行、分支、子流程、动态扩展和回调，适合无法在同步请求窗口完成的多阶段处理；生产系统还需处理幂等、重试、超时、状态持久化和失败回调
    source: 40_知识库/系统架构/异步DAG任务编排.md
    status: verified
  - id: claim-008
    text: 拓扑感知分层任务窃取中，线程先读本地队列，本地为空时从共享同一缓存的线程窃取，仅当整个本地域空闲且其他域严重积压时跨域窃取，把任务迁移成本纳入调度判断，避免全局随机窃取破坏缓存热度
    source: 40_知识库/系统架构/拓扑感知分层任务窃取.md
    status: verified
  - id: claim-009
    text: 推送式任务调度适合任务到达不均匀、节点众多或任务生命周期较长的场景；调度器需维护连接、等待队列、节点配额和故障状态，并提供断线重连、幂等下发与背压
    source: 40_知识库/系统架构/推送式任务调度.md
    status: verified
  - id: claim-010
    text: 调度系统容灾不只是多副本，还包括故障检测、影响范围隔离和恢复后的状态补偿；典型措施有故障节点黑名单、重试专用队列、缓存故障回源限流、数据库维护期间暂停回写、双单元独立运行和保留旧系统快速回切
    source: 40_知识库/系统架构/调度系统容灾降级.md
    status: verified

  # ── 人工智能 ──
  - id: claim-011
    text: Agent 上下文 Self-GC 采用三阶段：异步规划可折叠、遮罩或删除的内容；本地预演检查对象标识错误和误删风险；在工具执行结束等安全边界延迟提交；比按字符截断更重视语义身份、执行一致性和可回退性
    source: 40_知识库/人工智能/Agent上下文Self-GC.md
    status: verified
  - id: claim-012
    text: Agent 可以自动完成可逆、范围明确的检测和安装步骤，但遇到地区许可证不适用、磁盘不足、硬件不可运行、需要用户权限或可能覆盖既有安装时必须停止；删除仅限经完整路径确认的损坏文件
    source: 40_知识库/人工智能/Agent安装任务安全边界.md
    status: verified
  - id: claim-013
    text: Agent 评测集应覆盖常见任务、关键失败场景和高风险边界，并在模型、提示词、技能或知识更新后重复运行；它不是一次性演示，而是 Agent 系统的持续回归基线
    source: 40_知识库/人工智能/Agent评测集.md
    status: verified
  - id: claim-014
    text: AI Native 项目运作机制中，决策聚焦价值假设、快速形成 MVP、让真实用户使用并收集行为和反馈，再决定加固或停止；安全、可靠性与成本治理不能省略，但其深度应与已验证的使用规模同步增长
    source: 40_知识库/人工智能/AI-Native项目运作机制.md
    status: verified
  - id: claim-015
    text: AI 学徒式经验采集是 AI 先为经验拥有者提供排班、预测、整理或分析等实际帮助，再通过日常复盘和互问互答采集「为什么这样做」，这种交换关系比一次性访谈更容易获得真实、动态且非标准化的经验
    source: 40_知识库/人工智能/AI学徒式经验采集.md
    status: verified
  - id: claim-016
    text: 企业 AI 落地不是「上线一个模型」，而是重新设计人、AI 与业务系统之间的协作关系；人负责目标、判断、关系和最终责任，AI 负责规模化的信息处理、认知辅助与规则明确的执行
    source: 40_知识库/人工智能/FDE优化企业工作流程的方法.md
    status: verified
  - id: claim-017
    text: FDE（前置部署工程师）会把咨询公司的价值链从「研究问题—提出建议—交付报告」推进到「诊断问题—构建系统—嵌入流程—持续运营—验证结果」，形成 Service as Software 形态
    source: 40_知识库/人工智能/FDE对咨询公司商业模式的影响.md
    status: verified
    note: 播客语境下的模式观察（嘉宾口述，无第三方验证），长文须标注证据边界
  - id: claim-018
    text: 一线智能体把通用分析能力与现场人员掌握的局部信息结合起来：AI 扩展信息处理能力，人提供真实情境并做最终判断；这一模式不是取消标准，而是让标准负责底线、现场决策在边界内获得更高适应性
    source: 40_知识库/人工智能/一线智能体赋能.md
    status: verified
  - id: claim-019
    text: 企业 AI 技能平台需要同时支持公共技能与私域技能，明确所有者、版本、权限、依赖和验收方式；使用规模扩大后贡献者与场景会形成网络效应；应用发布平台负责把技能组合成可被非开发者直接使用的作品
    source: 40_知识库/人工智能/企业AI技能生态.md
    status: verified
  - id: claim-020
    text: 企业级 Agent 沙箱隔离需要覆盖身份、集群、运行时、网络、文件系统、资源配额和审计；MicroVM 能提供强于普通进程的边界，预热池和生命周期控制用于降低启动延迟
    source: 40_知识库/人工智能/企业级Agent沙箱隔离.md
    status: verified
  - id: claim-021
    text: 原子 Agent 能力应有清晰输入、边界、输出和失败语义；复合任务通过顺序或并行组合原子能力完成，复合 Agent 不再嵌套复合 Agent，可降低死循环、状态不透明和无效算力消耗
    source: 40_知识库/人工智能/原子Agent自我闭环.md
    status: verified
  - id: claim-022
    text: 成本感知模型路由中，强推理任务优先使用高能力模型、简单任务使用高性价比模型、缓存已热时要计算切换导致的缓存失效成本、路由超时或不确定时回退到稳妥模型，目标是以质量约束为前提降低成本
    source: 40_知识库/人工智能/成本感知模型路由.md
    status: verified
  - id: claim-023
    text: 领域 Agent 不必重建通用底座（会话、工具和编排由底座提供），应专注于领域身份、知识治理、权限、上下文路由和可复用技能，使其他 Agent 能获取同一份可信事实
    source: 40_知识库/人工智能/领域Agent作为事实源.md
    status: verified
